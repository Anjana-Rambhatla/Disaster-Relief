<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Form - Disaster Relief</title>
  <style>
    /* General page styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #f0f8ff, #c1e4f5);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 1.2rem;
      margin: 10px 0;
      text-align: left;
    }

    input, select {
      padding: 10px;
      font-size: 1rem;
      margin: 5px 0 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

<style>
 .donate-btn {
    padding: 12px 24px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease-in-out;
    text-decoration: none;
    display: inline-block;
    color: light green;  /* Corrected */
    text-align: center;
    box-shadow: 0 4px 15px rgba(0, 128, 0, 0.3);
}

.donate-btn:hover {
    background: green;  /* Changes to dark green on hover */
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(0, 100, 0, 0.5);
}

  </style>
</head>
<body>

  <div class="container">
    <h1>Your Kindness,<br> Their Hope!</h1>

    <!-- Donation Form -->
    <form action="donation-thank-you.html" method="POST">
      <!-- Name Field -->
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="Your Full Name">

      <!-- Email Field -->
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="Your Email Address">

<!-- Donation Amount Field -->
<label for="amount">Donation Amount (Rs)</label>
<input type="text" id="amount" name="amount" required placeholder="Enter Donation Amount">

<!-- Donate Now Button -->
     <a href="pay.html" style="text-decoration: none;">
    <button type="button" class="donate-btn">Donate Now</button>
</a>
